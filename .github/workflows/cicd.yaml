name: Deploy Todo App to ECS Fargate

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: todoapp-images
  ECS_SERVICE_NAME: todoapp-service
  ECS_CLUSTER_NAME: todo-app-cluster
  ECS_TASK_DEFINITION_NAME: todo-app-taskdef
  CONTAINER_NAME: todoapp-container
  CONTAINER_PORT: 80

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=app --cov-report=xml || true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    outputs:
      ecr-image-uri: ${{ steps.build-image.outputs.image-uri }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          LATEST_URI=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          
          docker build -t $IMAGE_URI -t $LATEST_URI .
          docker push $IMAGE_URI
          docker push $LATEST_URI
          
          echo "image-uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "✅ Docker image pushed: $IMAGE_URI"

  deploy-to-fargate:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition' > task-definition.json

      - name: Update task definition with new image
        run: |
          # Update only the image, keep all other fields intact
          jq --arg IMAGE "${{ needs.build-and-push-image.outputs.ecr-image-uri }}" \
            '.containerDefinitions[0].image = $IMAGE' \
            task-definition.json > new-task-definition.json

      - name: Register new task definition
        id: register-task
        run: |
          TASK_RESPONSE=$(aws ecs register-task-definition \
            --family ${{ env.ECS_TASK_DEFINITION_NAME }} \
            --cli-input-json file://new-task-definition.json \
            --region ${{ env.AWS_REGION }})
          
          TASK_ARN=$(echo $TASK_RESPONSE | jq -r '.taskDefinition.taskDefinitionArn')
          echo "task-definition-arn=$TASK_ARN" >> $GITHUB_OUTPUT
          echo "✅ New task definition registered: $TASK_ARN"

      - name: Update ECS service with new task definition
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --service ${{ env.ECS_SERVICE_NAME }} \
            --task-definition ${{ steps.register-task.outputs.task-definition-arn }} \
            --region ${{ env.AWS_REGION }}
          echo "✅ Service update initiated"

      - name: Wait for service to stabilize
        run: |
          echo "⏳ Waiting for ECS service to stabilize (this may take 2-3 minutes)..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --services ${{ env.ECS_SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }}
          echo "✅ Service stabilized successfully!"

      - name: Log deployment details
        if: success()
        run: |
          echo "✅ ECS Fargate Deployment Successful!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Service: ${{ env.ECS_SERVICE_NAME }}"
          echo "Cluster: ${{ env.ECS_CLUSTER_NAME }}"
          echo "Region: ${{ env.AWS_REGION }}"
          echo "Image: ${{ needs.build-and-push-image.outputs.ecr-image-uri }}"
          echo "Task Definition: ${{ steps.register-task.outputs.task-definition-arn }}"
          echo "Container Port: ${{ env.CONTAINER_PORT }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Handle deployment failure
        if: failure()
        run: |
          echo "❌ ECS Fargate deployment failed!"
          echo "Check CloudWatch logs at: /ecs/todo-app-taskdef"
          exit 1
