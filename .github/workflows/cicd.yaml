name: cicd workflow

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: todoapp-images
  EC2_INSTANCE_ID: i-0fa4f857ba46a46a1
  APP_PORT: 5000
  APP_NAME: todoapp
  CONTAINER_PORT: 5000

jobs:
  # STAGE 1: TEST
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=app --cov-report=xml || true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Test stage completed
        run: |
          echo "✅ Test stage completed successfully!"

  # STAGE 2: BUILD AND PUSH IMAGE
  build-and-push-image:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    outputs:
      ecr-image-uri: ${{ steps.build-image.outputs.image-uri }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          LATEST_URI=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          
          docker build -t $IMAGE_URI -t $LATEST_URI .
          docker push $IMAGE_URI
          docker push $LATEST_URI
          
          echo "image-uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "✅ Docker image pushed: $IMAGE_URI"

      - name: Build stage completed
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Build and Push stage completed!"
          echo "Image: ${{ steps.build-image.outputs.image-uri }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # STAGE 3: DEPLOY TO EC2
  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EC2 Public IP
        id: get-ip
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ env.EC2_INSTANCE_ID }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "public-ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "✅ EC2 Public IP: $PUBLIC_IP"

      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ steps.get-ip.outputs.public-ip }}
          IMAGE_URI: ${{ needs.build-and-push-image.outputs.ecr-image-uri }}
        run: |
          # Setup SSH key
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # Deploy application
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST << 'EOFSH'
          set -e
          
          echo "🚀 Starting deployment..."
          
          # Stop and remove running container if exists
          docker stop ${{ env.APP_NAME }} 2>/dev/null || true
          docker rm ${{ env.APP_NAME }} 2>/dev/null || true
          
          # Get AWS credentials for ECR login
          export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          export AWS_DEFAULT_REGION=${{ env.AWS_REGION }}
          
          # Login to ECR
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin $(echo "${{ env.IMAGE_URI }}" | cut -d'/' -f1)
          
          # Pull latest image
          echo "📥 Pulling Docker image..."
          docker pull ${{ env.IMAGE_URI }}
          
          # Run container
          echo "🐳 Starting Docker container..."
          docker run -d \
            --name ${{ env.APP_NAME }} \
            -p ${{ env.APP_PORT }}:${{ env.CONTAINER_PORT }} \
            --restart always \
            --log-driver awslogs \
            --log-opt awslogs-group=/var/log/todoapp \
            --log-opt awslogs-region=${{ env.AWS_REGION }} \
            ${{ env.IMAGE_URI }}
          
          echo "✅ Container started successfully!"
          docker ps -a | grep ${{ env.APP_NAME }}
          EOFSH

      - name: Verify deployment
        env:
          EC2_HOST: ${{ steps.get-ip.outputs.public-ip }}
        run: |
          echo "⏳ Waiting for app to be ready..."
          sleep 10
          
          echo "🔍 Testing application..."
          curl -f http://$EC2_HOST:${{ env.APP_PORT }}/ || echo "⚠️  App may still be starting, trying again..."
          sleep 5
          curl http://$EC2_HOST:${{ env.APP_PORT }}/ || true

      - name: Log deployment details
        if: success()
        env:
          EC2_HOST: ${{ steps.get-ip.outputs.public-ip }}
        run: |
          echo "✅ EC2 Deployment Successful!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Instance ID: ${{ env.EC2_INSTANCE_ID }}"
          echo "Public IP: $EC2_HOST"
          echo "Application URL: http://$EC2_HOST:${{ env.APP_PORT }}"
          echo "Docker Image: ${{ needs.build-and-push-image.outputs.ecr-image-uri }}"
          echo "Container Port: ${{ env.CONTAINER_PORT }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Handle deployment failure
        if: failure()
        run: |
          echo "❌ EC2 deployment failed!"
          exit 1
