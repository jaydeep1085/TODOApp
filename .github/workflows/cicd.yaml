name: Deploy to EC2

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  EC2_INSTANCE_ID: i-05e623536bebad601
  APP_PORT: 5000

jobs:
  test:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=app --cov-report=xml || true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  deploy:
    runs-on: self-hosted
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          EC2_USER: ubuntu
          EC2_HOST: ${{ secrets.EC2_PUBLIC_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # Deploy application
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST << 'EOFSH'
            cd /home/ubuntu/todoapp || mkdir -p /home/ubuntu/todoapp
            cd /home/ubuntu/todoapp
            git clone https://github.com/${{ github.repository }}.git . || git pull origin main
            
            # Stop existing app
            pkill -f "python.*app.py" || true
            
            # Install dependencies
            python3 -m pip install --upgrade pip
            pip3 install -r requirements.txt gunicorn
            
            # Start app with gunicorn
            nohup gunicorn -w 4 -b 0.0.0.0:${{ env.APP_PORT }} app.app:app > /var/log/todoapp.log 2>&1 &
            
            echo "✅ Application deployed successfully!"
          EOFSH

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment to EC2 successful!"
          echo "Instance: ${{ env.EC2_INSTANCE_ID }}"
          echo "Access at: http://${{ secrets.EC2_PUBLIC_IP }}:${{ env.APP_PORT }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment to EC2 failed!"
          exit 1
