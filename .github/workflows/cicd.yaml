name: Deploy to ECS Fargate Stage

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: todoapp-images
  ECS_SERVICE_NAME: todoapp-taskdef-service-s924q5wl
  ECS_CLUSTER_NAME: todo-app-cluster
  ECS_TASK_DEFINITION_NAME: todo-app-taskdef
  CONTAINER_NAME: todoapp-container
  CONTAINER_PORT: 80

jobs:
  deploy-to-fargate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition' > task-definition.json

      - name: Clean task definition (remove read-only fields)
        run: |
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-definition.json > cleaned-task-definition.json

      - name: Get latest image URI from ECR
        id: get-image
        run: |
          IMAGE_URI=$(aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --query 'sort_by(imageDetails, &imagePushedAt)[-1].imageTags[0]' \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          FULL_IMAGE_URI=$REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_URI
          
          echo "image-uri=$FULL_IMAGE_URI" >> $GITHUB_OUTPUT
          echo "✅ Latest image URI: $FULL_IMAGE_URI"

      - name: Update task definition with new image
        run: |
          jq --arg IMAGE "${{ steps.get-image.outputs.image-uri }}" \
            '.containerDefinitions[0].image = $IMAGE' \
            cleaned-task-definition.json > new-task-definition.json

      - name: Register new task definition
        id: register-task
        run: |
          TASK_RESPONSE=$(aws ecs register-task-definition \
            --family ${{ env.ECS_TASK_DEFINITION_NAME }} \
            --cli-input-json file://new-task-definition.json \
            --region ${{ env.AWS_REGION }})
          
          TASK_ARN=$(echo $TASK_RESPONSE | jq -r '.taskDefinition.taskDefinitionArn')
          echo "task-definition-arn=$TASK_ARN" >> $GITHUB_OUTPUT
          echo "✅ New task definition registered: $TASK_ARN"

      - name: Update ECS service with new task definition
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --service ${{ env.ECS_SERVICE_NAME }} \
            --task-definition ${{ steps.register-task.outputs.task-definition-arn }} \
            --region ${{ env.AWS_REGION }}
          echo "✅ Service update initiated"

      - name: Wait for service to stabilize
        run: |
          echo "⏳ Waiting for ECS service to stabilize (this may take 2-3 minutes)..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER_NAME }} \
            --services ${{ env.ECS_SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }}
          echo "✅ Service stabilized successfully!"

      - name: Log deployment details
        if: success()
        run: |
          echo "✅ ECS Fargate Deployment Successful!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Service: ${{ env.ECS_SERVICE_NAME }}"
          echo "Cluster: ${{ env.ECS_CLUSTER_NAME }}"
          echo "Region: ${{ env.AWS_REGION }}"
          echo "Image: ${{ steps.get-image.outputs.image-uri }}"
          echo "Task Definition: ${{ steps.register-task.outputs.task-definition-arn }}"
          echo "Container Port: ${{ env.CONTAINER_PORT }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Handle deployment failure
        if: failure()
        run: |
          echo "❌ ECS Fargate deployment failed!"
          echo "Check CloudWatch logs at: /ecs/todo-app-taskdef"
          exit 1
